[package]
name = "truffle"
version.workspace = true
edition = "2021"
build = "build.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "color", "help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.4"
same-file = "1.0"
tempfile = "3"
png = "0.17"
regex = "1.10"
full_moon = "2.0.0"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1.48", features = ["full"] }
indicatif = "0.18"
indicatif-log-bridge = "0.2"
owo-colors = { version = "4", features = ["supports-colors"] }
truffle-config = { path = "../truffle-config" }
asphalt = { path = "../asphalt" }
fontdue = "0.9"
ttf-parser = "0.21"
dotenvy = "0.15"
log = "0.4"
env_logger = { version = "0.11", features = ["color"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking", "query"] }
mlua = { version = "0.10", features = ["luau", "vendored"] }
